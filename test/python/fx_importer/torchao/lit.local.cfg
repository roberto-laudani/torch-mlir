import subprocess

# The tests run with %PYTHON, which can differ from the Python running lit, so
# check that torchao imports there. This also keeps torchao's import warnings
# out of the lit output.
config.unsupported = not config.enable_bindings_python or "Windows" in config.host_os
if not config.unsupported:
  probe = [config.python_executable, "-c", "import torchao"]
  config.unsupported = subprocess.run(probe, capture_output=True).returncode != 0
